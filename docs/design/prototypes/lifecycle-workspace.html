  <script>
  'use strict';
  const $=s=>document.querySelector(s);const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const icon=n=>`<svg aria-hidden="true"><use href="#i-${n}"/></svg>`;
  const rows=[
    {id:'9007199254741001',key:'TK-261101',title:'公开服务证书即将到期，请核对续期与验证记录',type:'配置复核',state:'待处理',priority:'高',owner:'林舟',tags:['需复核'],time:'09:22',due:'今天截止',source:'示例源 S1'},
    {id:'9007199254741002',key:'TK-261102',title:'外部发现记录对应的整改结果需要补充证据',type:'风险整改',state:'处理中',priority:'高',owner:'林舟',tags:['证据待补'],time:'09:10',due:'明天截止',source:'示例源 S1'},
    {id:'9007199254741003',key:'TK-261103',title:'复核内部应用的访问范围，等待责任人反馈',type:'权限复核',state:'待外部反馈',priority:'中',owner:'林舟',tags:['访问复核'],time:'昨天',due:'7天后',source:'本平台'},
    {id:'9007199254741004',key:'TK-261104',title:'依赖更新后确认服务恢复和回退记录',type:'风险整改',state:'待复测',priority:'中',owner:'许棠',tags:[],time:'昨天',due:'3天后',source:'本平台'},
    {id:'9007199254741005',key:'TK-261105',title:'核对一次性临时权限的关闭结果',type:'权限复核',state:'已关闭',priority:'低',owner:'林舟',tags:['已核验'],time:'11月9日',due:'已完成',source:'本平台'},
    {id:'9007199254741006',key:'TK-261106',title:'对照来源记录补充系统责任人',type:'信息核对',state:'待处理',priority:'中',owner:'周岸',tags:['责任确认'],time:'11月9日',due:'5天后',source:'示例源 S2'}
  ];
  const history=[{value:'203.0.113.10',type:'IP',time:'今天 09:18',count:2},{value:'example.org',type:'域名',time:'昨天 16:42',count:1},{value:'198.51.100.24',type:'IP',time:'11月9日 11:20',count:1}];
  const app={view:'home',role:'member',state:'ready',compact:false,selected:new Set(),keyword:'',status:'unclosed',priority:'',mine:true,tag:'',date:'',expanded:false,detailId:rows[0].id,intelHistory:0,intelValue:'203.0.113.10',intelType:'IP',intelQueried:false,agentDirty:false,agentSaved:false,planConfirmed:false,agentConfig:{name:'安全工单助手',kind:'平台业务助手',model:'内部通用模型 · 示例连接',rounds:'4',duration:'60',toolQuery:true,toolDraft:true,toolPlan:true}};
  let dialogInvoker=null,toastTimer=null,pendingView=null;
  let savedAgentConfig={...app.agentConfig};
  const pageNames={home:'工作台',tickets:'工单',detail:'工单详情',intel:'情报查询',agent:'业务助手',devices:'设备'};
  const owned=()=>app.role==='operator'?rows:rows.filter(r=>r.owner==='林舟');
  const todo=()=>owned().filter(r=>r.owner==='林舟'&&r.state!=='已关闭');
  const tagHtml=(text,type='')=>`<span class="tag ${type}">${esc(text)}</span>`;
  const stateTag=s=>tagHtml(s,s==='已关闭'?'success':s==='待处理'?'warning':s==='处理中'?'brand':'');
  const selectedRow=()=>rows.find(r=>r.id===app.detailId)||rows[0];
  function toast(text){clearTimeout(toastTimer);$('#toast').textContent=text;$('#toast').hidden=false;toastTimer=setTimeout(()=>$('#toast').hidden=true,4200)}
  function openDialog(title,body,footer){clearTimeout(toastTimer);$('#toast').hidden=true;dialogInvoker=document.activeElement;$('#modal-title').textContent=title;$('#modal-body').innerHTML=body;$('#modal-footer').innerHTML=footer;$('#modal').showModal()}
  function closeDialog(){$('#modal').close()}
  $('#modal').addEventListener('close',()=>{if(dialogInvoker?.isConnected)dialogInvoker.focus();else $('#main-content').focus();dialogInvoker=null});
  function nav(view,force=false){if(app.role==='empty'&&view!=='home')view='home';if(app.view==='agent'&&app.agentDirty&&!force&&view!==app.view){pendingView=view;openDialog('尚有未保存的配置','<p>离开后将放弃本次未保存的修改。已发布的配置不受影响。</p>','<button data-action="close-dialog">继续编辑</button><button data-action="discard-navigation" class="primary">放弃并离开</button>');return}clearTimeout(toastTimer);$('#toast').hidden=true;app.view=view;app.state='ready';app.selected.clear();$('#state-control').value='ready';$('#sidebar').classList.remove('is-open');$('#mobile-scrim').classList.remove('is-open');$('#menu-toggle').setAttribute('aria-expanded','false');render();$('#main-content').scrollTop=0;$('#main-content').focus()}
  function header(title,subtitle,actions=''){return `<div class="page-header"><div><h1>${title}</h1><p class="page-subtitle">${subtitle}</p></div>${actions?`<div class="page-actions">${actions}</div>`:''}</div>`}
  function statePanel(){const n=pageNames[app.view];if(app.state==='loading')return `<section class="panel state-panel" aria-busy="true" aria-label="${n}正在加载"><div class="state-inner"><h2>正在读取${n}内容</h2><p>请稍候，正在读取与你有关的内容。</p><div class="skeleton" aria-hidden="true"><span></span><span></span><span></span></div></div></section>`;if(app.state==='error')return `<section class="panel state-panel" role="alert"><div class="state-inner"><div class="state-symbol" aria-hidden="true">!</div><h2>暂时无法读取${n}内容</h2><p>当前状态尚未确认。重新读取不会重复提交工单或执行任务。</p><button class="primary" data-action="retry-state">重新读取</button></div></section>`;return `<section class="panel state-panel"><div class="state-inner"><div class="state-symbol" aria-hidden="true">—</div><h2>${app.view==='home'?'目前没有需要你处理的事项':app.view==='intel'?'还没有本机查询记录':app.view==='agent'?'还没有可用的业务助手':'当前范围没有记录'}</h2><p>${app.view==='home'?'新的任务和消息会出现在这里。你可以前往已授权的业务页面。':'可以调整当前条件，或由有权限的人员补充内容。'}</p><button data-action="retry-state">查看正常示例</button></div></section>`}
  function home(){if(app.role==='empty')return header('你好，林舟','示例运营组 · 个人工作台')+`<section class="panel notice"><div class="notice-icon">${icon('home')}</div><div><h2>欢迎回来，你的工作台已经就绪</h2><p>当前尚未分配业务页面。你仍可查看个人消息；需要处理工单时，请联系管理员分配相应权限。</p><button class="primary" data-action="messages">查看我的消息</button><button class="quiet" data-action="profile">个人资料</button></div></section>`;const t=todo();return header('你好，林舟','先处理与你有关的事项。当前显示本人可见范围，数据时间为今天 09:30。',app.role==='operator'?'<button class="primary" data-action="create-ticket">＋ 新建工单</button>':'')+`<div class="summary-grid"><button class="panel summary-card" data-action="my-todo"><span class="summary-top">我的待办${icon('ticket')}</span><strong>${t.length}</strong><span class="caption">本人负责且尚未结束的工单</span></button><button class="panel summary-card" data-action="due-filter"><span class="summary-top">近期需要处理${icon('clock')}</span><strong>2</strong><span class="caption">今天至明天截止的待办</span></button><button class="panel summary-card" data-action="messages"><span class="summary-top">未读消息${icon('bell')}</span><strong>2</strong><span class="caption">查看与你有关的变更</span></button></div><div class="grid-two"><div class="stack"><section class="panel"><div class="panel-header"><div><h2>需要我处理</h2><div class="caption">按截止时间排列 · 本平台处置</div></div><button class="link" data-action="my-todo">查看全部 ${icon('arrow')}</button></div><ul class="list">${t.map(r=>`<li class="work-item"><div class="work-item-main"><div class="item-meta"><span>${esc(r.key)}</span>${stateTag(r.state)}</div><button class="link item-title" data-detail="${r.id}">${esc(r.title)}</button><div class="item-meta"><span>${esc(r.type)}</span><span>${esc(r.source)}</span>${r.tags.map(v=>tagHtml(v)).join('')}</div></div><span class="due">${esc(r.due)}</span></li>`).join('')}</ul></section><section class="panel"><div class="panel-header"><h2>最近活动</h2><span class="caption">本人可见记录</span></div><div class="panel-body"><ol class="timeline"><li class="accent"><time>今天 09:22</time>你收到了一项证书续期复核待办。</li><li><time>今天 09:10</time>许棠为整改工单补充了一份验证记录。</li><li><time>昨天 16:35</time>一项权限复核已关闭，处置记录已保留。</li></ol></div></section></div><div class="stack"><section class="panel"><div class="panel-header"><h2>来源与同步</h2><span class="source-label">合成示例</span></div><div class="panel-body"><div class="source-item"><span class="source-dot" aria-hidden="true"></span><div><h3>示例发现源 S1</h3><p class="caption">最近接收：今天 09:20<br>专业结论由来源提供</p></div></div><div class="source-item"><span class="source-dot" aria-hidden="true"></span><div><h3>示例责任目录 S2</h3><p class="caption">最近接收：今天 08:45<br>临时人工补充会单独标识</p></div></div></div></section><section class="panel"><div class="panel-header"><h2>常用入口</h2></div><div class="panel-body stack" style="gap:12px"><button class="link" data-view="tickets">查找我的工单 ${icon('arrow')}</button><button class="link" data-view="intel">查询情报 ${icon('arrow')}</button><button class="link" data-view="agent">使用业务助手 ${icon('arrow')}</button></div></section></div></div>`}
  function filtered(){return owned().filter(r=>(!app.keyword||`${r.title} ${r.key}`.toLowerCase().includes(app.keyword.toLowerCase()))&&(!app.status||(app.status==='unclosed'?r.state!=='已关闭':r.state===app.status))&&(!app.priority||r.priority===app.priority)&&(!app.mine||r.owner==='林舟')&&(!app.tag||r.tags.includes(app.tag))&&(!app.date||['今天截止','明天截止'].includes(r.due)))}
  function filterChips(){const chips=[];if(app.keyword)chips.push(['keyword',`关键词：${app.keyword}`]);if(app.status)chips.push(['status',`状态：${app.status==='unclosed'?'未关闭':app.status}`]);if(app.priority)chips.push(['priority',`优先级：${app.priority}`]);if(app.mine)chips.push(['mine','处理人：我']);if(app.tag)chips.push(['tag',`标签：${app.tag}`]);if(app.date)chips.push(['date','截止：今天至明天']);return `<span class="caption">当前条件</span>${chips.map(([k,v])=>`<button class="chip" data-clear-filter="${k}" aria-label="移除${esc(v)}">${esc(v)} <span aria-hidden="true">×</span></button>`).join('')}${chips.length?'<button class="link" data-action="clear-filters">清除全部</button>':'<span class="caption">全部可见工单</span>'}`}
  function ticketRows(){const rs=filtered();return rs.length?rs.map(r=>`<tr class="${app.selected.has(r.id)?'is-selected':''}"><td class="col-check"><input type="checkbox" data-select-id="${r.id}" aria-label="选择工单${r.key}" ${app.selected.has(r.id)?'checked':''}></td><td><button class="table-title" data-detail="${r.id}">${esc(r.title)}</button><span class="ticket-key">${r.key} · ${esc(r.type)}</span></td><td>${stateTag(r.state)}</td><td>${tagHtml(r.priority,r.priority==='高'?'warning':'')}</td><td>${esc(r.owner)}</td><td><div class="row-tags">${r.tags.length?r.tags.map(v=>tagHtml(v)).join(''):'<span class="muted">—</span>'}</div></td><td class="muted">${esc(r.time)}</td></tr>`).join(''):'<tr><td colspan="7"><div class="state-panel" style="min-height:220px"><div><h2>没有符合条件的工单</h2><p>当前筛选仍然有效，可以移除条件后重试。</p><button data-action="clear-filters">清除筛选</button></div></div></td></tr>'}
  function updateList(){if(app.view!=='tickets'||app.state!=='ready')return;$('#filter-chips').innerHTML=filterChips();$('#ticket-rows').innerHTML=ticketRows();const n=filtered().length;$('#list-total').textContent=`${n} 项结果 · 当前可见范围`;$('#pagination-total').textContent=`共 ${n} 项，当前显示第1页`;
    $('#selection-region').hidden=!app.selected.size;$('#selection-count').textContent=`已选择 ${app.selected.size} 项`;
    const ids=filtered().map(r=>r.id),picked=ids.filter(id=>app.selected.has(id)).length;$('#select-all').checked=ids.length>0&&picked===ids.length;$('#select-all').indeterminate=picked>0&&picked<ids.length;const hiddenCount=Number(app.mine)+Number(Boolean(app.tag))+Number(Boolean(app.date));$('#advanced-toggle').textContent=`${app.expanded?'收起筛选':'更多筛选'}${hiddenCount?`（${hiddenCount}）`:''}`;$('#advanced-toggle').setAttribute('aria-expanded',String(app.expanded));$('#advanced-filters').hidden=!app.expanded}
  function tickets(){return header('工单','查找、跟踪和协作处理当前有权查看的工单。',app.role==='operator'?'<button class="primary" data-action="create-ticket">＋ 新建工单</button>':'')+`<section class="panel"><div class="toolbar"><div class="field search"><label for="ticket-search">关键词</label><input id="ticket-search" type="search" value="${esc(app.keyword)}" placeholder="标题或工单编号"></div><div class="field small"><label for="status-filter">状态</label><select id="status-filter"><option value="">全部状态</option><option value="unclosed" ${app.status==='unclosed'?'selected':''}>未关闭</option><option value="待处理" ${app.status==='待处理'?'selected':''}>待处理</option><option value="处理中" ${app.status==='处理中'?'selected':''}>处理中</option><option value="已关闭" ${app.status==='已关闭'?'selected':''}>已关闭</option></select></div><div class="field small"><label for="priority-filter">优先级</label><select id="priority-filter"><option value="">全部优先级</option>${['高','中','低'].map(v=>`<option ${app.priority===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="toolbar-right"><button id="advanced-toggle" aria-controls="advanced-filters" aria-expanded="false" data-action="advanced">更多筛选</button></div></div><div class="advanced-filters" id="advanced-filters" hidden><label class="checkbox-label"><input id="mine-filter" type="checkbox" ${app.mine?'checked':''}>只看我处理的</label><div class="field small"><label for="date-filter">截止时间</label><select id="date-filter"><option value="">全部时间</option><option value="due" ${app.date?'selected':''}>今天至明天</option></select></div><div class="field small"><label for="tag-filter">标签</label><select id="tag-filter"><option value="">全部标签</option>${['需复核','证据待补','访问复核','已核验'].map(v=>`<option ${app.tag===v?'selected':''}>${v}</option>`).join('')}</select></div></div><div class="chips" id="filter-chips"></div><div class="table-topline"><span id="list-total"></span><span>表格密度：${app.compact?'紧凑':'舒适'} · 可选择本页记录</span></div><div class="selection-bar" id="selection-region" hidden><strong id="selection-count" aria-live="polite"></strong><button class="primary" data-action="batch-tags">添加标签</button><span class="caption">只作用于明确选中的工单</span><button class="quiet clear-selection" data-action="clear-selection">清除选择</button></div><div class="table-scroll" tabindex="0" aria-label="工单结果表，窄屏可横向滚动"><table><caption class="visually-hidden">当前筛选下的工单，可选择本页记录并添加标签</caption><colgroup><col class="col-check"><col class="col-title"><col class="col-state"><col class="col-priority"><col class="col-owner"><col class="col-labels"><col class="col-time"></colgroup><thead><tr><th scope="col"><input type="checkbox" id="select-all" aria-label="选择本页全部工单"></th><th scope="col">工单</th><th scope="col">状态</th><th scope="col">优先级</th><th scope="col">处理人</th><th scope="col">标签</th><th scope="col">更新</th></tr></thead><tbody id="ticket-rows"></tbody></table></div><div class="table-footer"><span id="pagination-total"></span><div class="pager"><span>每页20项</span><button disabled aria-label="上一页">上一页</button><button aria-current="page">1</button><button disabled aria-label="下一页">下一页</button></div></div></section>`}

  function resetSelection(){app.selected.clear();updateList()}
  function filterChanged(key,value){app[key]=value;resetSelection()}
  function showPlan(){const can=app.role==='operator'&&app.agentConfig.toolPlan;openDialog('核对计划，再确认',`<p>以下是结构化示例草案。请核对触发时间、数据范围和停止条件；内容改变后需要重新确认。</p><div class="plan-summary"><dl class="properties"><dt>计划</dt><dd>每周工单复核</dd><dt>执行时间</dt><dd>每周一 09:00</dd><dt>时区</dt><dd>Asia/Shanghai（中国标准时间）</dd><dt>接下来三次</dt><dd>11月16日、11月23日、11月30日 09:00</dd><dt>数据范围</dt><dd>林舟有权查看且由本人处理的未关闭工单</dd><dt>动作</dt><dd>生成待确认的复核草案；每次建单前再次确认</dd><dt>确认政策</dt><dd>每次业务写入逐次确认；本计划不授予自动建单权限</dd><dt>执行上限</dt><dd>最多10次，至2027-01-18结束；可提前暂停</dd><dt>运行前检查</dt><dd>每次检查授权与目标范围，撤权后停止</dd></dl></div>${!can?'<div class="alert">当前身份没有确认此业务写入的权限。可以查看草案，不能创建计划。</div>':''}<label class="checkbox-label"><input id="plan-ack" type="checkbox" ${!can?'disabled':''}>我已核对时间、范围和停止条件</label><p class="caption" style="margin-top:12px">设计演示：确认只改变本页状态，不创建真实计划或工单。</p>`,'<button data-action="close-dialog">返回修改</button><button class="primary" id="confirm-plan" data-action="confirm-plan" disabled>确认计划（仅预览）</button>')}
  document.addEventListener('click',async e=>{const button=e.target.closest('button');if(!button||button.disabled)return;if(button.dataset.view){nav(button.dataset.view);return}if(button.dataset.detail){app.detailId=button.dataset.detail;nav('detail');return}if(button.dataset.clearFilter){const key=button.dataset.clearFilter;app[key]=key==='mine'?false:'';app.selected.clear();render();return}if(button.dataset.history!==undefined){const i=Number(button.dataset.history);app.intelHistory=i;app.intelValue=history[i].value;app.intelType=history[i].type;app.intelQueried=false;render();document.querySelector(`[data-history="${i}"]`)?.focus();return}if(button.dataset.copy){try{await navigator.clipboard.writeText(button.dataset.copy);toast('查询值已复制')}catch{toast('复制未完成，请手动选择查询值')}return}switch(button.dataset.action){
    case 'close-dialog':closeDialog();break;
    case 'retry-state':app.state='ready';$('#state-control').value='ready';render();toast('已显示正常示例');break;
    case 'my-todo':app.status='unclosed';app.mine=true;app.keyword='';app.date='';nav('tickets');break;
    case 'due-filter':app.status='unclosed';app.mine=true;app.date='due';nav('tickets');break;
    case 'advanced':app.expanded=!app.expanded;updateList();break;
    case 'clear-filters':Object.assign(app,{keyword:'',status:'',priority:'',mine:false,tag:'',date:''});app.selected.clear();render();break;
    case 'clear-selection':resetSelection();break;
    case 'batch-tags':openDialog('为选中的工单添加标签',`<p>本次影响 <strong>${app.selected.size}</strong> 项明确选中的工单。已有相同标签时保持原状；每项仍需核验权限。</p><div class="field"><label for="batch-tag-input">标签名称</label><input id="batch-tag-input" type="text" maxlength="50" placeholder="例如：本周复核" autofocus></div><p class="caption" style="margin-top:12px">此原型演示本页选择，不包含跨页全选。不会改动真实数据。</p>`,'<button data-action="close-dialog">取消</button><button class="primary" data-action="apply-tags">添加到选中工单</button>');break;
    case 'apply-tags':{const input=$('#batch-tag-input'),value=input.value.trim();if(!value){input.setCustomValidity('请填写标签名称');input.reportValidity();input.setCustomValidity('');return}let changed=0,unchanged=0;const unchangedIds=new Set();const chosen=[...app.selected];for(const id of chosen){const row=rows.find(r=>r.id===id);if(row.tags.includes(value)){unchanged++;unchangedIds.add(id)}else{row.tags.push(value);changed++}}closeDialog();app.selected.clear();render();openDialog('标签处理结果',`<p>以下仅为合成示例的本页处理回执。</p><div class="inline-actions">${tagHtml(`${changed}项已添加`,'success')}${tagHtml(`${unchanged}项原本已有`)}</div><ul class="partial-results">${chosen.map(id=>{const r=rows.find(v=>v.id===id);return `<li><span class="tag ${unchangedIds.has(id)?'':'success'}">${unchangedIds.has(id)?'原本已有':'已添加'}</span><span>${r.key}</span><span class="muted">${esc(value)}</span></li>`}).join('')}</ul>`,'<button class="primary" data-action="close-dialog">完成</button>');break}
    case 'add-detail-tag':{const v=$('#detail-tag').value.trim();if(!v){$('#detail-tag').focus();return}const r=selectedRow();if(!r.tags.includes(v))r.tags.push(v);render();toast('示例工单的标签已更新');break}
    case 'assign':openDialog('分派工单','<p>选择当前允许分派的处理人。本页名单为合成示例；真实提交仍需检查组织范围和目标账号状态。</p><div class="field"><label for="assignee-input">处理人</label><select id="assignee-input"><option>林舟</option><option>许棠</option></select></div>','<button data-action="close-dialog">取消</button><button class="primary" data-action="apply-assign">确认分派（示例）</button>');break;
    case 'apply-assign':selectedRow().owner=$('#assignee-input').value;closeDialog();render();toast('示例分派已更新，未发出真实请求');break;
    case 'verify':openDialog('提交复测','<p>提交前请确保处置说明和证据已补齐。真实状态转换会重新检查当前工单版本、权限和业务条件。</p>','<button data-action="close-dialog">取消</button><button class="primary" data-action="apply-verify">提交复测（示例）</button>');break;
    case 'apply-verify':selectedRow().state='待复测';closeDialog();render();toast('示例工单已进入待复测，未执行真实转换');break;
    case 'query-intel':app.intelValue=$('#intel-value').value.trim();app.intelType=$('#intel-type').value;if(!app.intelValue){$('#intel-value').focus();return}app.intelQueried=true;render();toast('已显示合成查询结果，没有连接真实情报服务');break;
    case 'save-agent':if(!$('#agent-rounds').reportValidity()||!$('#agent-duration').reportValidity())return;savedAgentConfig={...app.agentConfig};app.agentDirty=false;app.agentSaved=true;render();toast('配置草稿已保存于本页演示状态');break;
    case 'preview-plan':showPlan();break;
    case 'confirm-plan':if(app.role!=='operator'||!app.agentConfig.toolPlan||!$('#plan-ack').checked)return;app.planConfirmed=true;closeDialog();render();toast('计划确认演示完成，未创建真实任务或工单');break;
    case 'discard-navigation':app.agentConfig={...savedAgentConfig};app.agentDirty=false;closeDialog();nav(pendingView,true);pendingView=null;break;
    case 'create-ticket':openDialog('新建工单','<p>这里将进入独立的工单发起页，按类型填写和核对必填内容。本预览只展示入口位置，不创建真实工单。</p>','<button class="primary" data-action="close-dialog">返回工作区</button>');break;
    case 'source':openDialog('来源记录','<p>示例源S1 · DISC-SAMPLE-482</p><p>此条目为合成引用，不包含真实来源地址。正式接入将保留来源编号、接收时间和受权深链，原平台再次核验访问权限。</p>','<button class="primary" data-action="close-dialog">返回工单</button>');break;
    case 'evidence':openDialog('验证说明','<p>此文件名与内容仅为合成示例。正式证据应保留来源、上传者、时间、访问范围与必要的完整性信息。</p>','<button class="primary" data-action="close-dialog">关闭</button>');break;
    case 'messages':openDialog('我的消息','<ul class="list"><li class="evidence-row"><div><h3>工单需要补充验证记录</h3><p class="caption">今天09:10 · 合成示例</p></div></li><li class="evidence-row"><div><h3>你的复核任务已更新</h3><p class="caption">昨天16:35 · 合成示例</p></div></li></ul>','<button class="primary" data-action="close-dialog">关闭</button>');break;
    case 'profile':openDialog('个人资料','<dl class="properties"><dt>姓名</dt><dd>林舟（合成）</dd><dt>所属组织</dt><dd>示例运营组</dd><dt>业务权限</dt><dd>尚未分配</dd></dl>','<button class="primary" data-action="close-dialog">关闭</button>');break;
    case 'extensions':openDialog('内部应用','<p>显示当前身份可访问的内部应用。复杂业务保留独立页面，访问目标后仍需核验身份与权限。</p><div class="extension-item"><h3>设备台账</h3><p class="caption">内部扩展 · 当前身份可见设备与受权管理入口</p><button data-action="extension-devices">打开设备工作区</button></div><div class="extension-item"><h3>示例资产查询</h3><p class="caption">内部服务 · 查询入口 · 合成示例</p><button data-action="extension-link">前往应用 '+icon('link')+'</button></div><div class="extension-item"><h3>示例责任核对</h3><p class="caption">本工作区表单 · 仅查看本人范围</p><button data-action="extension-form">打开核对表单</button></div>','<button data-action="close-dialog">关闭</button>');break;
    case 'extension-devices':closeDialog();nav('devices');break;
    case 'device-sources':openDialog('设备来源与时效','<p>台账类别：已有CMDB；安全关联类别：已有SOC。具体接口与字段仍待核验。</p><p>监控、访问代理与运维网关供给尚未确认。本页设备名、厂商、状态和观测时间全部为合成示例，不代表真实接入。</p><p>状态由适配层保留原始状态及来源时间；陈旧、未知和故障必须分开显示。</p>','<button class="primary" data-action="close-dialog">返回设备</button>');break;
    case 'device-open':if(app.role==='operator')openDialog('打开设备管理页',`<p>${esc(button.dataset.deviceId)} · 合成设备</p><p>正式入口会再次检查设备范围、目标地址与访问权限，然后打开厂商管理页。这里不会实际跳转，也不提供或传递密码。</p><p>此设备默认人工登录；自动登录须另行按厂商、固件和登录方式验证。</p>`,'<button class="primary" data-action="close-dialog">知道了（不实际跳转）</button>');break;
    case 'extension-link':toast('这是合成入口，没有真实地址，也不会发送身份凭据');break;
    case 'extension-form':openDialog('责任核对','<p>简单扩展使用工作区统一的标题、字段与反馈样式；只展示已授权范围。</p><div class="field"><label for="extension-object">对象编号</label><input id="extension-object" type="text" value="APP-SAMPLE-01" readonly></div><div class="field"><label for="extension-owner">责任人</label><input id="extension-owner" type="text" value="林舟（合成）" readonly></div>','<button class="primary" data-action="close-dialog">关闭</button>');break;
  }});
  document.addEventListener('input',e=>{if(e.target.id==='ticket-search')filterChanged('keyword',e.target.value);if(e.target.id==='history-search'){const q=e.target.value.toLowerCase();document.querySelectorAll('[data-history]').forEach(b=>b.hidden=!history[Number(b.dataset.history)].value.toLowerCase().includes(q))}if(e.target.matches('[data-agent-field]')){if(e.target.dataset.agentKey)app.agentConfig[e.target.dataset.agentKey]=e.target.type==='checkbox'?e.target.checked:e.target.value;app.agentDirty=true;const badge=$('.page-actions .tag');if(badge){badge.textContent='有未保存修改';badge.classList.add('warning')}}});
  document.addEventListener('change',e=>{const id=e.target.id;if(id==='role-control'){app.role=e.target.value;app.agentDirty=false;app.agentSaved=false;app.planConfirmed=false;nav('home',true)}else if(id==='state-control'){app.state=e.target.value;render()}else if(id==='status-filter')filterChanged('status',e.target.value);else if(id==='priority-filter')filterChanged('priority',e.target.value);else if(id==='mine-filter')filterChanged('mine',e.target.checked);else if(id==='date-filter')filterChanged('date',e.target.value);else if(id==='tag-filter')filterChanged('tag',e.target.value);else if(id==='select-all'){filtered().forEach(r=>e.target.checked?app.selected.add(r.id):app.selected.delete(r.id));updateList()}else if(e.target.dataset.selectId){e.target.checked?app.selected.add(e.target.dataset.selectId):app.selected.delete(e.target.dataset.selectId);updateList()}else if(id==='plan-ack')$('#confirm-plan').disabled=app.role!=='operator'||!app.agentConfig.toolPlan||!e.target.checked});
  $('#density-control').addEventListener('click',()=>{app.compact=!app.compact;render()});
  function closeMobile(){$('#sidebar').classList.remove('is-open');$('#mobile-scrim').classList.remove('is-open');$('#menu-toggle').setAttribute('aria-expanded','false');$('#menu-toggle').focus()}
  $('#menu-toggle').addEventListener('click',()=>{const open=$('#sidebar').classList.toggle('is-open');$('#mobile-scrim').classList.toggle('is-open',open);$('#menu-toggle').setAttribute('aria-expanded',String(open));if(open)$('#sidebar .brand').focus()});$('#mobile-scrim').addEventListener('click',closeMobile);document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#sidebar').classList.contains('is-open')){e.preventDefault();closeMobile()}});
  render();
  </script>
</body>
